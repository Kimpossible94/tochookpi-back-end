server.port=8081

spring.application.name=tochookpi
spring.profiles.include=DEV_ENV

spring.datasource.url=jdbc:mysql://localhost:3307/tochookpi_db
spring.datasource.username=${mysql-id}
spring.datasource.password=${mysql-password}

naver.client.id=${naver-api-client-id}
naver.client.secret=${naver-api-client-secret}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=6000

jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

logging.level.org.springframework.security=DEBUG
